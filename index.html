html<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obby: Mega Cubo 3D - Pou Edition</title>
    <!-- Motor 3D ultra-seguro por Google CDN -->
    <script src="https://googleapis.com"></script>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #020208;
            font-family: 'Courier New', Courier, monospace; user-select: none;
        }
        /* PANTALLA DE CARGA */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #101026 0%, #020208 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; transition: opacity 0.5s ease;
        }
        .title-logo {
            color: #ffaa00; font-size: 32px; font-weight: bold;
            text-shadow: 3px 3px 0px #000, 0 0 15px rgba(255,170,0,0.3);
            margin-bottom: 5px; text-align: center;
        }
        .loader-container {
            width: 280px; background: #222; height: 16px; border-radius: 8px;
            border: 2px solid #444; overflow: hidden; margin-bottom: 15px;
        }
        .loader-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff5722, #ffaa00); transition: width 0.1s linear; }
        .btn-play {
            background: #4caf50; color: white; border: none; padding: 12px 40px;
            font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 0 #2e7d32; opacity: 0; transform: scale(0.8);
            transition: all 0.3s ease; pointer-events: none;
        }
        .btn-play.ready { opacity: 1; transform: scale(1); pointer-events: auto; }
        
        /* HUD DEL SERVIDOR */
        #hud {
            position: absolute; top: 15px; left: 15px;
            background: rgba(5, 5, 20, 0.85); padding: 15px; border-radius: 10px;
            border: 2px solid #00ffcc; z-index: 10; font-size: 14px; color: #fff;
            pointer-events: none; display: none; box-shadow: 0 0 10px rgba(0,255,204,0.2);
        }
        #game-canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <!-- INTERFAZ DE CARGA -->
    <div id="loading-screen">
        <div class="title-logo">OBBY: DIG BRAINROTS 3D</div>
        <div style="color:#00ffcc; margin-bottom:30px; font-size:12px; letter-spacing:2px;">MEGA CUBO 128x128</div>
        <div class="loader-container">
            <div class="loader-bar" id="progress-bar"></div>
        </div>
        <div id="loading-text">Generando Pou y motor de fisicas... 0%</div>
        <button class="btn-play" id="play-button" onclick="startGame()">JUGAR</button>
    </div>

    <!-- HUD EN VIVO -->
    <div id="hud">
        <strong style="color:#ffaa00;">CONTROLES ACTIVOS</strong><br>
        Moverse: W, A, S, D o Flechas<br>
        Saltar: Barra Espaciadora<br>
        <span style="color:#00ffcc; font-size:11px;">¡No te caigas de las bases de 20x20!</span>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        const progressBar = document.getElementById('progress-bar');
        const loadingText = document.getElementById('loading-text');
        const playButton = document.getElementById('play-button');
        const loadingScreen = document.getElementById('loading-screen');
        const hud = document.getElementById('hud');

        let loadProgress = 0;
        let scene, camera, renderer, megaCube, pouCharacter;
        let isGameRunning = false;
        const cubeGlobalSize = 40; 
        
        // Variables de físicas balanceadas para Pou
        let pouPhysics = {
            x: 0, y: 1.5, z: 25, 
            vx: 0, vy: 0, vz: 0,
            speed: 0.15, gravity: -0.012, jumpForce: 0.32,
            isGrounded: true
        };

        // Captura limpia del teclado
        let keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function initWorld3D() {
            try {
                const canvas = document.getElementById('game-canvas');
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x020208);

                // CORRECCIÓN: Usar la variable global directamente sin anteponer const/let
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

                renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);

                // Iluminación
                const ambientLight = new THREE.AmbientLight(0x555577);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffaa44, 1.2);
                dirLight.position.set(50, 80, 50);
                scene.add(dirLight);

                // Polvo de estrellas
                const starsGeometry = new THREE.BufferGeometry();
                const starsCount = 1000;
                const starPositions = new Float32Array(starsCount * 3);
                for(let i=0; i < starsCount * 3; i++) {
                    starPositions[i] = (Math.random() - 0.5) * 400;
                }
                starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
                const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 });
                const starField = new THREE.Points(starsGeometry, starsMaterial);
                scene.add(starField);

                // Bloque maestro central estructural
                megaCube = new THREE.Group();
                const coreGeometry = new THREE.BoxGeometry(cubeGlobalSize, cubeGlobalSize, cubeGlobalSize);
                const edges = new THREE.EdgesGeometry(coreGeometry);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x3d3d5c });
                const wireframe = new THREE.LineSegments(edges, lineMat);
                
                const coreMaterial = new THREE.MeshStandardMaterial({ color: 0x141424, roughness: 0.8 });
                const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
                coreMesh.add(wireframe);
                megaCube.add(coreMesh);

                // Las 4 plataformas de 20x20 laterales
                const baseSize = 20;
                const bGeo = new THREE.BoxGeometry(1, 1, 1);
                const bMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.7 });
                const bEdge = new THREE.LineSegments(new THREE.EdgesGeometry(bGeo), new THREE.LineBasicMaterial({ color: 0x1a4a1a }));

                // CORRECCIÓN: Uso estricto de la constante definida arriba para evitar saltos matemáticos
                const baseOffsets = [
                    { x: 0, z: cubeGlobalSize / 2 },
                    { x: cubeGlobalSize / 2, z: 0 },
                    { x: 0, z: -cubeGlobalSize / 2 },
                    { x: -cubeGlobalSize / 2, z: 0 }
                ];

                baseOffsets.forEach((offset, idx) => {
                    const baseGroup = new THREE.Group();
                    for(let x = -baseSize/2; x < baseSize/2; x++) {
                        for(let z = -baseSize/2; z < baseSize/2; z++) {
                            const blockMesh = new THREE.Mesh(bGeo, bMat);
                            const wire = bEdge.clone();
                            blockMesh.add(wire);
                            blockMesh.position.set(x, 0, z);
                            baseGroup.add(blockMesh);
                        }
                    }
                    baseGroup.position.set(offset.x, 0.5, offset.z);
                    if(idx === 1 || idx === 3) baseGroup.rotation.y = Math.PI / 2;
                    megaCube.add(baseGroup);
                });

                scene.add(megaCube);

                // --- ENSAMBLAJE VECTORIAL DE POU 3D ---
                pouCharacter = new THREE.Group();
                
                const bodyGeo = new THREE.CylinderGeometry(0.1, 0.8, 1.2, 16);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb07d50, roughness: 0.9 });
                const pouBody = new THREE.Mesh(bodyGeo, bodyMat);
                pouBody.position.y = 0.6; 
                pouCharacter.add(pouBody);

                // Ojo Izquierdo
                const eyeGeo = new THREE.SphereGeometry(0.16, 8, 8);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
                eyeL.position.set(-0.25, 0.7, 0.6);
                pouCharacter.add(eyeL);

                // Pupila Izquierda
                const pupilGeo = new THREE.SphereGeometry(0.06, 8, 8);
                const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
                pupilL.position.set(-0.25, 0.7, 0.73);
                pouCharacter.add(pupilL);

                // Ojo Derecho Clonado
                const eyeR = eyeL.clone();
                eyeR.position.x = 0.25;
                pouCharacter.add(eyeR);

                // Pupila Derecha Clonada
                const pupilR = pupilL.clone();
                pupilR.position.x = 0.25;
                pouCharacter.add(pupilR);

                scene.add(pouCharacter);

                window.addEventListener('resize', () => {
                    if (camera && renderer) {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
}});simulateLoading();} catch (err) {loadingText.innerText = "Error cargando graficos 3D.";console.error(err);}}function simulateLoading() {loadProgress += Math.floor(Math.random() * 15) + 5;if (loadProgress > 100) loadProgress = 100;progressBar.style.width = loadProgress + '%';loadingText.innerText = Inyectando avatar de Pou 3D... ${loadProgress}%;if (loadProgress < 100) {setTimeout(simulateLoading, 80);} else {loadingText.innerText = "¡Todo listo para jugar!";loadingText.style.color = "#00ffcc";playButton.classList.add('ready');}}function startGame() {loadingScreen.style.opacity = '0';setTimeout(() => {loadingScreen.style.display = 'none';hud.style.display = 'block';isGameRunning = true;}, 500);}function animate() {requestAnimationFrame(animate);if (isGameRunning) {pouPhysics.vx = 0;pouPhysics.vz = 0;if (keys['w'] || keys['arrowup']) pouPhysics.vz = -pouPhysics.speed;if (keys['s'] || keys['arrowdown']) pouPhysics.vz = pouPhysics.speed;if (keys['a'] || keys['arrowleft']) pouPhysics.vx = -pouPhysics.speed;if (keys['d'] || keys['arrowright']) pouPhysics.vx = pouPhysics.speed;if (keys[' '] && pouPhysics.isGrounded) {pouPhysics.vy = pouPhysics.jumpForce;pouPhysics.isGrounded = false;}// Caida libre continuapouPhysics.vy += pouPhysics.gravity;pouPhysics.x += pouPhysics.vx;pouPhysics.y += pouPhysics.vy;pouPhysics.z += pouPhysics.vz;// Restriccion de colision fisica en bordes de plataformaif (pouPhysics.z >= 20 && pouPhysics.z <= 40 && pouPhysics.x >= -10 && pouPhysics.x <= 10) {if (pouPhysics.y <= 1.0) {pouPhysics.y = 1.0;pouPhysics.vy = 0;pouPhysics.isGrounded = true;}} else {pouPhysics.isGrounded = false;}// Bucle de reaparicion seguraif (pouPhysics.y < -30) {pouPhysics.x = 0;pouPhysics.y = 10;pouPhysics.z = 25;pouPhysics.vy = 0;}if (pouCharacter) {pouCharacter.position.set(pouPhysics.x, pouPhysics.y, pouPhysics.z);if (pouPhysics.vx !== 0 || pouPhysics.vz !== 0) {pouCharacter.rotation.y = Math.atan2(pouPhysics.vx, pouPhysics.vz);}}// Ajuste automatico orbital de camara de seguimientoif (camera) {camera.position.set(pouPhysics.x, pouPhysics.y + 4, pouPhysics.z + 8);camera.lookAt(pouPhysics.x, pouPhysics.y + 1, pouPhysics.z);}} else {if (megaCube) megaCube.rotation.y += 0.002;}if (renderer && scene && camera) {renderer.render(scene, camera);}}window.onload = function() {initWorld3D();animate();};
